<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Анна Сушкова. Каталог декора для свадьбы, юбилея, выпускного и Нового года.">
  <title>Анна Сушкова — декор событий</title>
  <link rel="stylesheet" href="./catalog.css?v=catalog-screen">
  <link rel="stylesheet" href="./themes.css?v=catalog-screen">
  <link rel="stylesheet" href="./full-bleed.css?v=readable-captions">
  <link rel="stylesheet" href="./motion.css?v=catalog-screen">
  <link rel="stylesheet" href="./editor.css">
  <link rel="stylesheet" href="./glass.css?v=violet-scene">
  <script src="./catalog.js?v=violet-scene" type="module"></script>
  <script src="./editor.js" type="module"></script>
  <script src="./glass.js?v=violet-scene" type="module"></script>
</head>
<body data-theme="journal">
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="#home">Анна Сушкова</a>
      <div class="header-actions">
        <button class="editor-only background-button" type="button" data-edit-path="heroBackground" data-edit-type="background">Фон сайта</button>
        <button class="edit-toggle" type="button" data-edit-toggle>Редактировать</button>
      </div>
    </div>
  </header>
  <main id="catalog-view">
    <noscript><p>Для просмотра каталога включите JavaScript.</p></noscript>
  </main>
  <nav class="theme-switch" aria-label="Варианты оформления">
    <button type="button" data-theme-select="journal" aria-pressed="true">Вариант 1</button>
    <button type="button" data-theme-select="album" aria-pressed="false">Вариант 2</button>
    <button type="button" data-theme-select="studio" aria-pressed="false">Вариант 3</button>
    <button type="button" data-theme-select="glass" aria-pressed="false">Вариант 4</button>
  </nav>
  <dialog class="work-dialog" aria-labelledby="detail-title"></dialog>
</body>
</html>
